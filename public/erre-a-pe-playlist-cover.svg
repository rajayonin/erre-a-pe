<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Erre a Pé — playlist cover</title>
  <desc id="desc">A warm, distressed hip-hop record sleeve with bold Erre a Pé lettering and a stylized vinyl record.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21170f"/>
      <stop offset=".55" stop-color="#120e0b"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="disc" cx="34%" cy="29%" r="76%">
      <stop offset="0" stop-color="#443023"/>
      <stop offset=".45" stop-color="#211711"/>
      <stop offset="1" stop-color="#0a0908"/>
    </radialGradient>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="15" r="1.2" fill="#f4ecdf" opacity=".14"/>
      <circle cx="51" cy="78" r=".8" fill="#e8642a" opacity=".2"/>
      <circle cx="101" cy="31" r="1" fill="#d9a441" opacity=".16"/>
      <path d="M17 108h15M77 9h8M91 92h19" stroke="#f4ecdf" stroke-width="1" opacity=".07"/>
    </pattern>
    <clipPath id="cover"><rect width="1000" height="1000"/></clipPath>
  </defs>
  <g clip-path="url(#cover)">
    <rect width="1000" height="1000" fill="url(#paper)"/>
    <path d="M0 0h1000v1000H0z" fill="none" stroke="#d9a441" stroke-width="2" opacity=".5"/>
    <path d="M52 0v1000M948 0v1000" stroke="#f4ecdf" stroke-width="1" opacity=".12"/>

    <!-- Oversized record, cropped like a sleeve detail -->
    <circle cx="765" cy="478" r="356" fill="url(#disc)" stroke="#e8642a" stroke-width="3" opacity=".94"/>
    <circle cx="765" cy="478" r="326" fill="none" stroke="#d9a441" stroke-width="2" opacity=".34"/>
    <circle cx="765" cy="478" r="298" fill="none" stroke="#f4ecdf" stroke-width="1" opacity=".16"/>
    <circle cx="765" cy="478" r="269" fill="none" stroke="#f4ecdf" stroke-width="2" opacity=".12"/>
    <circle cx="765" cy="478" r="231" fill="none" stroke="#e8642a" stroke-width="3" opacity=".25"/>
    <circle cx="765" cy="478" r="196" fill="none" stroke="#f4ecdf" stroke-width="1" opacity=".18"/>
    <circle cx="765" cy="478" r="157" fill="none" stroke="#d9a441" stroke-width="2" opacity=".28"/>
    <circle cx="765" cy="478" r="116" fill="#e8642a"/>
    <circle cx="765" cy="478" r="91" fill="#17100b"/>
    <circle cx="765" cy="478" r="8" fill="#d9a441"/>
    <path d="M765 478 994 186" stroke="#f4ecdf" stroke-width="13" stroke-linecap="round" opacity=".74"/>
    <circle cx="994" cy="186" r="27" fill="#d9a441"/>
    <circle cx="994" cy="186" r="12" fill="#17100b"/>

    <!-- Sleeve typography -->
    <text x="74" y="105" fill="#d9a441" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="7">DECIBELIA LISTENING PARTY</text>
    <path d="M74 132h404" stroke="#e8642a" stroke-width="5"/>
    <text x="65" y="382" fill="#f4ecdf" font-family="Arial Black, Helvetica, sans-serif" font-size="184" font-weight="900" letter-spacing="-13">ERRE</text>
    <text x="65" y="562" fill="#f4ecdf" font-family="Arial Black, Helvetica, sans-serif" font-size="184" font-weight="900" letter-spacing="-13">A PÉ</text>
    <path d="M72 610h465" stroke="#d9a441" stroke-width="4"/>
    <text x="77" y="669" fill="#e8642a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="9">RAP EN ESPAÑOL</text>
    <text x="78" y="730" fill="#b0a190" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="4">1997 - 2007</text>
    <text x="77" y="914" fill="#f4ecdf" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="5" opacity=".72">UNA SELECCIÓN PARA ESCUCHAR</text>
    <text x="882" y="918" fill="#d9a441" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="4">LP / 01</text>

    <!-- Print wear and edge marks -->
    <rect width="1000" height="1000" fill="url(#grain)" opacity=".75"/>
    <path d="M64 820h220M64 832h112M64 844h168" stroke="#f4ecdf" stroke-width="2" opacity=".12"/>
    <path d="M917 64h19M926 73v-19M64 936h19M73 945v-19" stroke="#e8642a" stroke-width="3" opacity=".75"/>
  </g>
</svg>
